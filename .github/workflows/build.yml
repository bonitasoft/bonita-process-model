name: Build

run-name: Build ${{ github.ref_name }}

on:
  push:
    branches:
      - develop
      - release/*
      - support/*
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Maven Settings
        uses: bonitasoft/maven-settings-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Build and deploy
        run: ./mvnw -B -ntp deploy -Pjacoco

      - name: Setup Java 21 for Sonar Scanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR decoration / PR info for SonarCloud
        run: ./mvnw -B -ntp sonar:sonar
