name: Build

run-name: Build ${{ github.ref_name }}

on:
  push:
    branches:
      - develop
      - release/*
      - support/*
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Maven Settings
        uses: bonitasoft/maven-settings-action@v2
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Build and deploy
        run: ./mvnw -B -ntp deploy -Pjacoco

      - name: Setup Java 21 for Sonar Scanner
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR decoration / PR info for SonarCloud
        run: ./mvnw -B -ntp sonar:sonar
