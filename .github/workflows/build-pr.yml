name: Build Pull Request

on:
  pull_request:
    branches:
      - develop
      - release/*
      - support/*
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build-pr.yml'
      - '**/*.md'

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Groovy
        # this is required for tests to compile groovy code correctly
        run: |
          sudo apt-get update
          sudo apt-get -y install groovy

      - name: Configure Maven Settings
        uses: bonitasoft/maven-settings-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Build
        run: ./mvnw -B -ntp verify -Pjacoco

      - name: Setup Java 21 for Sonar Scanner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Sonar Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR decoration / PR info for SonarCloud
        run: ./mvnw -B -ntp sonar:sonar
