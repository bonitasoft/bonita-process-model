name: Release

run-name: Release ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        # Required because tychoBuild=true in gitflow-maven-plugin causes the plugin
        # to skip POM version updates when releaseVersion is blank (it sets the default
        # version to the current version including -SNAPSHOT, so no change is detected).
        description: 'Version to release (e.g. 8.0.3). Required for Tycho builds.'
        type: string
        required: true
      nextDevelopmentVersion:
        description: 'Next development version (leave empty to use versionDigitToIncrement policy)'
        type: string
        default: ''
      versionDigitToIncrement:
        description: 'Version digit to increment in the next development version: 0=major (X.0.0), 1=minor (X.Y.0), 2=patch (X.Y.Z)'
        type: choice
        default: '2'
        options:
          - '0'
          - '1'
          - '2'

jobs:
  build:
    name: Release pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Groovy
        # this is required for tests to compile groovy code correctly
        run: |
          sudo apt-get update
          sudo apt-get -y install groovy

      - uses: bonitasoft/maven-settings-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - uses: bonitasoft/git-setup-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Create Release
        run: >
          ./mvnw -ntp --batch-mode gitflow:release
          -DgitFlowConfig.productionBranch=${{ github.ref_name }}
          -DgitFlowConfig.developmentBranch=${{ github.ref_name }}
          -DreleaseVersion=${{ github.event.inputs.version }}
          -DdevelopmentVersion=${{ github.event.inputs.nextDevelopmentVersion }}
          -DversionDigitToIncrement=${{ github.event.inputs.versionDigitToIncrement }}

      - name: Detect pre-release
        id: check
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" == *-* || "$VERSION" == *SNAPSHOT* ]]; then
            echo "Pre-release detected ($VERSION), skipping downstream notifications"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify bonita-project
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BONITA_CI_PAT }}
          repository: bonitasoft/bonita-project
          event-type: new-process-model-release
          client-payload: '{"release": "${{ github.event.inputs.version }}", "release_notes_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}"}'

      - name: Notify bonita-studio-sp
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BONITA_CI_PAT }}
          repository: bonitasoft/bonita-studio-sp
          event-type: new-process-model-release
          client-payload: '{"release": "${{ github.event.inputs.version }}", "release_notes_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}"}'
