name: Release

run-name: Release ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        # Required because tychoBuild=true in gitflow-maven-plugin causes the plugin
        # to skip POM version updates when releaseVersion is blank (it sets the default
        # version to the current version including -SNAPSHOT, so no change is detected).
        description: 'Version to release (e.g. 8.0.3). Required for Tycho builds.'
        type: string
        required: true
      nextDevelopmentVersion:
        description: 'Next development version (leave empty to use versionDigitToIncrement policy)'
        type: string
        default: ''
      versionDigitToIncrement:
        description: 'Version digit to increment in the next development version: 0=major (X.0.0), 1=minor (X.Y.0), 2=patch (X.Y.Z)'
        type: choice
        default: '2'
        options:
          - '0'
          - '1'
          - '2'

jobs:
  build:
    name: Release pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Groovy
        # this is required for tests to compile groovy code correctly
        run: |
          sudo apt-get update
          sudo apt-get -y install groovy

      - uses: bonitasoft/maven-settings-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - uses: bonitasoft/git-setup-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Create Release
        run: >
          ./mvnw -ntp --batch-mode gitflow:release
          -DgitFlowConfig.productionBranch=${{ github.ref_name }}
          -DgitFlowConfig.developmentBranch=${{ github.ref_name }}
          -DreleaseVersion=${{ github.event.inputs.version }}
          -DdevelopmentVersion=${{ github.event.inputs.nextDevelopmentVersion }}
          -DversionDigitToIncrement=${{ github.event.inputs.versionDigitToIncrement }}