name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        # Required because tychoBuild=true in gitflow-maven-plugin causes the plugin
        # to skip POM version updates when releaseVersion is blank (it sets the default
        # version to the current version including -SNAPSHOT, so no change is detected).
        description: 'Version to release (e.g. 8.0.3). Required for Tycho builds.'
        type: string
        required: true
      nextDevelopmentVersion:
        description: 'Next development version (leave empty to use versionDigitToIncrement policy)'
        type: string
        default: ''
      versionDigitToIncrement:
        description: 'Version digit to increment in the next development version: 0=major (X.0.0), 1=minor (X.Y.0), 2=patch (X.Y.Z)'
        type: choice
        default: '2'
        options:
          - '0'
          - '1'
          - '2'
      previous-tag:
        description: 'Previous tag to use for release notes generation'
        type: string
        required: true
      is-latest-release:
        description: 'Is this the latest release?'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail before anything is pushed: release notes generation runs last, after the Maven Central deploy
      - name: Verify previous tag exists
        env:
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
        run: git rev-parse --verify --quiet "refs/tags/$PREVIOUS_TAG"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Git Settings
        uses: bonitasoft/git-setup-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Create Release
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          NEXT_DEV_VERSION: ${{ inputs.nextDevelopmentVersion }}
          VERSION_DIGIT: ${{ inputs.versionDigitToIncrement }}
        run: >
          ./mvnw -ntp --batch-mode gitflow:release
          -DgitFlowConfig.productionBranch="$BRANCH"
          -DgitFlowConfig.developmentBranch="$BRANCH"
          -DreleaseVersion="$VERSION"
          -DdevelopmentVersion="$NEXT_DEV_VERSION"
          -DversionDigitToIncrement="$VERSION_DIGIT"
          -DskipTestProject

  publish:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Maven Settings
        uses: bonitasoft/maven-settings-action@v2
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Publish tag
        run: ./mvnw -ntp --batch-mode deploy -Prelease -DskipTests

  # Separate job so that a failure here can be re-run without redeploying to Maven Central
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.BONITA_CI_PAT }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          IS_LATEST: ${{ inputs.is-latest-release }}
        run: >
          gh release create "$VERSION"
          --generate-notes
          --notes-start-tag "$PREVIOUS_TAG"
          --latest="$IS_LATEST"
          --verify-tag

  # Separate job so that a failure here can be re-run without releasing again
  notify-consumers:
    needs: github-release
    # a pre-release must not open version bump PRs in the consumers
    if: ${{ !contains(inputs.version, '-') && !contains(inputs.version, 'SNAPSHOT') }}
    runs-on: ubuntu-24.04
    steps:
      # the deploy returns once Maven Central has validated the bundle, before it is published: the bump PRs the
      # consumers open would fail to resolve the artifact meanwhile
      - name: Wait for the release on Maven Central
        env:
          VERSION: ${{ inputs.version }}
        run: |
          url="https://repo1.maven.org/maven2/org/bonitasoft/bpm/org.bonitasoft.bpm.eclipse-repository/$VERSION/org.bonitasoft.bpm.eclipse-repository-$VERSION.zip"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --head --output /dev/null "$url"; then
              echo "$VERSION is available on Maven Central"
              exit 0
            fi
            echo "Not on Maven Central yet (attempt $attempt/60), retrying in 60s"
            sleep 60
          done
          echo "::error::$VERSION is still not on Maven Central after 60 minutes: re-run this job once it is"
          exit 1

      - name: Notify bonita-project
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.BONITA_CI_PAT }}
          repository: bonitasoft/bonita-project
          event-type: new-process-model-release
          client-payload: '{"release": "${{ inputs.version }}", "release_notes_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}"}'

      - name: Notify bonita-studio-sp
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.BONITA_CI_PAT }}
          repository: bonitasoft/bonita-studio-sp
          event-type: new-process-model-release
          client-payload: '{"release": "${{ inputs.version }}", "release_notes_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}"}'
