version: 2
updates:

  # Maintain dependencies for GitHub Actions (develop)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/8.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.0.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/8.1.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.1.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/9.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/9.0.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/10.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/10.0.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    # Exclude the pomless submodules (Tycho generates their pom.xml at build time)
    # so Dependabot doesn't fail on them and still parses the root pom.xml.
    exclude-paths:
      - "bundles/**"
      - "features/**"
      - "tests/**"
      - "sites/**"
    target-branch: develop
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tycho:
        patterns:
          - "org.eclipse.tycho*"
      apache-maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      maven-plugins:
        patterns:
          - "*maven-plugin"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Skip maven-jar-plugin 3.5.0+ due to Guice incompatibility (BPA-427)
      - dependency-name: "*maven-jar-plugin*"
        versions: ["[3.5.0,)"]
      # Only update Tycho within 4.x: Tycho 5+ requires Java 21+ to run the build (see issue #154).
      # Remove this ignore rule when the build moves to Java 21.
      - dependency-name: "org.eclipse.tycho*"
        versions: ["[5,)"]
