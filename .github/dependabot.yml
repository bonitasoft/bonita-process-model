version: 2
updates:

  # Maintain dependencies for GitHub Actions (develop)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # Maintain dependencies for GitHub Actions (support/8.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.0.x
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for GitHub Actions (support/8.1.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.1.x
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for GitHub Actions (support/9.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/9.0.x
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for maven
  - package-ecosystem: "maven" 
    directory: "/" 
    target-branch: develop
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"