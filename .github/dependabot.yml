version: 2
updates:

  # Maintain dependencies for GitHub Actions (develop)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/8.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.0.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/8.1.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/8.1.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for GitHub Actions (support/9.0.x)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: support/9.0.x
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Skip maven-jar-plugin 3.5.0+ due to Guice incompatibility (BPA-427)
      - dependency-name: "*maven-jar-plugin*"
        versions: ["[3.5.0,)"]
